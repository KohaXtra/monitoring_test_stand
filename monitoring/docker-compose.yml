# Имя проекта фиксировано: от него зависят имена volume'ов (monitoring_mimir-data и т.д.).
name: monitoring

# Версии образов закреплены: с :latest стенд через полгода поднимется на других
# версиях и может сломаться (формат конфигов Mimir/Loki/Alloy меняется между релизами).
services:

  app:
    build:
      context: ..
    container_name: app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"   # напрямую — для /chaos и /metrics; пользовательский трафик идёт через nginx
    networks:
      - monitoring

  nginx:
    image: nginx:1.27.5-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - monitoring

  k6:
    image: grafana/k6:2.3.0
    container_name: k6
    profiles: ["load"]
    command: run /scripts/load.js
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - nginx
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h   # коротко: долгое хранение — задача Mimir
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # node-exporter живёт в сети хоста
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    # Сеть хоста: иначе /proc/net/dev — это сетевой namespace контейнера (eth0 + lo),
    # и графики сети показывают трафик самого node-exporter, а не машины.
    # С host-сетью hostname задать нельзя — nodename в node_uname_info = имя машины.
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # слушает прямо на хосте; при смене порта поправь цели в prometheus.yml и config.alloy
      - --web.listen-address=:${NODE_EXPORTER_PORT:-9100}

  mimir:
    image: grafana/mimir:3.2.1
    container_name: mimir
    restart: unless-stopped
    command:
      - -config.file=/etc/mimir/mimir.yml
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # для discovery.docker / loki.source.docker
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # node-exporter живёт в сети хоста
    depends_on:
      - node-exporter
      - mimir
      - loki
      - app
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - mimir
      - loki
      - prometheus
    networks:
      - monitoring

volumes:
  mimir-data:
  grafana-data:
  loki-data:
  prometheus-data:

networks:
  monitoring:
    driver: bridge
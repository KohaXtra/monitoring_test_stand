events {}

http {
    # JSON-лог: в Loki разбирается через `| json`, время ответа берётся через `| unwrap`.
    # request_time — полное время на стороне nginx, upstream_response_time — сколько отвечало приложение.
    log_format json_log escape=json '{'
        '"ts":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"vhost":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"bytes_sent":$body_bytes_sent,'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /dev/stdout json_log;
    error_log  /dev/stderr warn;

    # Docker DNS: без resolve nginx резолвит `app` один раз при старте и после
    # пересоздания контейнера app продолжает слать запросы на старый IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream app {
        zone app 64k;                 # общая память — обязательна для resolve
        server app:8000 resolve;      # перерезолв по TTL resolver'а (nginx >= 1.27.3)
    }

    server {
        listen 80 default_server;
        server_name api.learnnginx.com docs.learnnginx.com _;

        # Один и тот же request_id попадает в лог nginx и в лог приложения.
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Метрики и ломалка наружу через прокси не отдаются.
        location = /metrics { return 404; }
        location = /chaos   { return 404; }
    }
}

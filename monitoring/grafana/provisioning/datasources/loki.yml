apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # request_id из строки лога превращается в ссылку: клик -> все строки этого запроса (nginx + app)
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":\s*"(\w+)"'
          datasourceUid: loki
          url: '{service=~"app|nginx"} |= `${__value.raw}`'

apiVersion: 1

providers:
  - name: default
    type: file
    updateIntervalSeconds: 30
    # Правки из UI сохраняются в БД Grafana (удобно на подготовке), но при изменении
    # JSON-файла он снова главный. Рабочий цикл: правка в UI -> экспорт JSON -> файл.
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
